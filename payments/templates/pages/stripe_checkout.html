{% extends "templates/payment_page.html" %}

{% block content %}
<h1>{{ description | e }}</h1>
<form id="payment-form">
	<label>{{ _("Name") }}
		<input id="payer-name" autocomplete="name" value="{{ payer_name | e }}">
	</label>
	<label>{{ _("Email") }}
		<input id="payer-email" type="email" autocomplete="email" value="{{ payer_email | e }}">
	</label>
	<div id="payment-element"></div>
	<button type="submit" id="submit">{{ _("Pay") }} {{ amount | e }}</button>
</form>
{% endblock %}
